<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>
  <circle cx="256" cy="256" r="160" fill="#ffffff" fill-opacity="0.1" />
  
  <!-- Currency Exchange Symbol: ₹ INR & $ CAD/USD -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Card / Chip Outline -->
    <rect x="136" y="146" width="240" height="150" rx="20" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="12" />
    <rect x="166" y="186" width="40" height="32" rx="6" fill="#f59e0b" stroke="none" />
    <!-- Exchange arrows -->
    <path d="M210 350 L340 350 M310 320 L340 350 L310 380" stroke="#38bdf8" stroke-width="20" />
    <path d="M302 410 L172 410 M202 440 L172 410 L202 380" stroke="#f59e0b" stroke-width="20" />
  </g>
  <text x="256" y="242" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">₹ ⇄ $</text>
</svg>
